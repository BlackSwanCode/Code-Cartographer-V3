[project]
name = "codecartographer"
version = "2.0.0"
description = "Analyseur de corpus de code source multi-langage — approche linguistique de corpus"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CodeCartographer Team"}
]
keywords = ["code-analysis", "corpus-linguistics", "static-analysis", "ast", "tree-sitter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Parsing universel
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.20.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-c-sharp>=0.20.0",
    "tree-sitter-typescript>=0.20.0",
    "tree-sitter-go>=0.20.0",
    "tree-sitter-rust>=0.20.0",
    "tree-sitter-java>=0.20.0",
    "tree-sitter-c>=0.20.0",
    "tree-sitter-cpp>=0.20.0",

    # Corpus & Analytique
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",

    # Réseaux & Graphs
    "networkx>=3.1",
    "pyvis>=0.3.0",

    # NLP & Sémantique
    "spacy>=3.7.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",

    # Git & Historique
    "gitpython>=3.1.0",

    # Visualisation
    "matplotlib>=3.7.0",
    "plotly>=5.17.0",

    # CLI & Utils
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "toml>=0.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
llm = [
    "ollama>=0.1.0",
    "openai>=1.0.0",
]
all = [
    "codecartographer[dev,llm]"
]

[project.scripts]
ccart = "codecartographer.cli.main:app"
codecartographer = "codecartographer.cli.main:app"

[project.urls]
Homepage = "https://github.com/codecartographer/codecartographer"
Documentation = "https://codecartographer.readthedocs.io"
Repository = "https://github.com/codecartographer/codecartographer"
Issues = "https://github.com/codecartographer/codecartographer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codecartographer"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
